<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #333;
      background: #fff;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
    }
    .header .dot.recording {
      background: #FF3B30;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .content {
      padding: 16px;
    }
    .status {
      text-align: center;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #666;
    }
    .status.active {
      background: #FFF0F0;
      color: #FF3B30;
    }
    .status .timer {
      font-size: 20px;
      font-weight: 600;
      margin-top: 4px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-record {
      background: #FF3B30;
      color: white;
    }
    .btn-record:hover { background: #E0352B; }
    .btn-record:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .btn-stop {
      background: #333;
      color: white;
    }
    .btn-stop:hover { background: #555; }
    .btn-stop:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .btn-replay {
      background: #007AFF;
      color: white;
      margin-top: 8px;
      width: 100%;
    }
    .btn-replay:hover { background: #0066D6; }
    .btn-replay:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .sessions {
      margin-top: 16px;
    }
    .sessions h2 {
      font-size: 13px;
      color: #999;
      margin-bottom: 8px;
    }
    .session-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #f9f9f9;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .session-item:hover { background: #f0f0f0; }
    .session-item .info {
      flex: 1;
    }
    .session-item .title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .session-item .meta {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }
    .session-item .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      flex: 0;
    }
    .session-item .delete-btn:hover { color: #FF3B30; }
    .empty {
      text-align: center;
      color: #ccc;
      padding: 20px;
      font-size: 13px;
    }
    .privacy-modal[hidden] {
      display: none;
    }
    .privacy-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgba(0, 0, 0, 0.35);
    }
    .privacy-dialog {
      width: 100%;
      max-height: calc(100vh - 24px);
      overflow: auto;
      padding: 16px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }
    .privacy-dialog h2 {
      font-size: 15px;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .privacy-dialog p {
      font-size: 12px;
      line-height: 1.55;
      color: #555;
      margin-bottom: 8px;
    }
    .privacy-dialog ul {
      padding-left: 18px;
      margin: 0 0 10px;
      font-size: 12px;
      line-height: 1.5;
      color: #666;
    }
    .privacy-check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      line-height: 1.45;
      color: #444;
      margin: 10px 0 12px;
    }
    .privacy-check input {
      margin-top: 2px;
    }
    .privacy-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .privacy-actions button {
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 13px;
    }
    .btn-cancel {
      background: #f1f1f1;
      color: #333;
    }
    .btn-cancel:hover {
      background: #e5e5e5;
    }
    .btn-confirm {
      background: #FF3B30;
      color: #fff;
    }
    .btn-confirm:hover {
      background: #E0352B;
    }
    .btn-confirm:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .privacy-link {
      width: 100%;
      padding: 6px;
      background: transparent;
      color: #007AFF;
      font-size: 12px;
      font-weight: 500;
    }
    .privacy-link:hover {
      background: #f5f9ff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot" id="statusDot"></div>
    <h1>Replay Debug</h1>
  </div>
  <div class="content">
    <div class="status" id="status">
      <div>就绪</div>
    </div>
    <div class="btn-group">
      <button class="btn-record" id="btnRecord">开始录制</button>
      <button class="btn-stop" id="btnStop" disabled>停止录制</button>
    </div>
    <button class="btn-replay" id="btnReplay" disabled>打开回放</button>
    <div class="sessions">
      <h2>历史录制</h2>
      <div id="sessionList"></div>
    </div>
  </div>
  <div class="privacy-modal" id="privacyModal" hidden>
    <div class="privacy-dialog" role="dialog" aria-modal="true" aria-labelledby="privacyTitle">
      <h2 id="privacyTitle">开始录制前确认</h2>
      <p>Replay Debug 会记录当前页面的内容和调试信息，用于本地回放和问题排查。</p>
      <ul>
        <li>可能记录页面 DOM、操作、URL、console、错误和少量截图。</li>
        <li>会记录 fetch / XHR 的请求元信息，默认不读取响应体。</li>
        <li>录制数据默认保存在本机浏览器，不会自动上传。</li>
      </ul>
      <label class="privacy-check">
        <input type="checkbox" id="privacyAcknowledge">
        <span>我已了解录制数据可能包含敏感信息，并同意开始录制。</span>
      </label>
      <div class="privacy-actions">
        <button class="btn-cancel" id="privacyCancel" type="button">取消</button>
        <button class="btn-confirm" id="privacyConfirm" type="button" disabled>开始录制</button>
      </div>
      <button class="privacy-link" id="privacyPolicy" type="button">查看隐私政策</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
